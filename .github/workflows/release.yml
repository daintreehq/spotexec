name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub release and upload assets

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # changelog from the full history
      - name: Tag must be on main
        # GitFlow: releases are cut from main only (merge develop or a
        # release/* branch into main first, then tag there).
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME is not on main; tag a commit on main to release"; exit 1; }
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Embed the helpers first, as `make build` does in CI, so the tests see
      # the same internal/helperbin/dist the release binaries ship with.
      - name: Build embedded helpers
        run: make helpers
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "v2.20.2"   # pinned; bump in ci.yml and release.yml together
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Deploy key with write access to daintreehq/homebrew-tap only.
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
