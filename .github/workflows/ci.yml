name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build (with embedded helpers)
        run: make build
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Smoke
        run: ./bin/spotexec version && ./bin/sx --help >/dev/null
