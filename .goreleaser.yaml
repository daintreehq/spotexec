version: 2
project_name: spotexec

before:
  hooks:
    # Cross-compile the remote helper for every runner platform and embed it.
    - make helpers VERSION={{ .Version }}
    # Refuse helpers built by any Go but the release go.mod pins (Makefile
    # HELPER_TARGETS); a missing one fails too.
    - >-
      ./scripts/check-go-version.sh
      internal/helperbin/dist/spotexec-helper-linux-amd64.gz
      internal/helperbin/dist/spotexec-helper-linux-arm64.gz
      internal/helperbin/dist/spotexec-helper-darwin-amd64.gz
      internal/helperbin/dist/spotexec-helper-darwin-arm64.gz
    # Completion scripts for spotexec and sx (archives, brew, packages).
    - make completions

builds:
  - id: spotexec
    main: ./cmd/spotexec
    binary: spotexec
    env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    hooks:
      # Each binary, checked as the helpers are, before anything is archived.
      post:
        - ./scripts/check-go-version.sh "{{ .Path }}"
    ldflags:
      - -s -w
      - -X github.com/daintreehq/spotexec/internal/cli.Version={{ .Version }}
      - -X github.com/daintreehq/spotexec/internal/helper.Version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md, completions/*]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    # Release notes list user-facing changes only: drop maintenance commits,
    # scoped or not (`test(transport): ...`, `ci!: ...`), and merge commits.
    exclude:
      - '^(docs|test|tests|chore|style|ci|build|release)(\([^)]*\))?!?:'
      - '^Merge (pull request|branch|remote-tracking branch) '

# Linux packages (apt / dnf / apk), attached to each GitHub release.
nfpms:
  - id: packages
    package_name: spotexec
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    homepage: https://spotexec.com
    maintainer: Greg Priday
    description: Offload tests and builds from local worktrees to remote and AWS Spot runners
    license: MIT
    formats: [deb, rpm, apk]
    dependencies: [git, openssh-client]
    overrides:
      rpm:
        dependencies: [git, openssh-clients]
      apk:
        dependencies: [git, openssh-client]
    contents:
      - src: /usr/bin/spotexec
        dst: /usr/bin/sx
        type: symlink
      - src: ./completions/spotexec.bash
        dst: /usr/share/bash-completion/completions/spotexec
      - src: ./completions/sx.bash
        dst: /usr/share/bash-completion/completions/sx
      - src: ./completions/spotexec.fish
        dst: /usr/share/fish/vendor_completions.d/spotexec.fish
      - src: ./completions/sx.fish
        dst: /usr/share/fish/vendor_completions.d/sx.fish
      # Debian's zsh reads vendor-completions; Fedora's and Alpine's site-functions.
      - src: ./completions/spotexec.zsh
        dst: /usr/share/zsh/vendor-completions/_spotexec
        packager: deb
      - src: ./completions/sx.zsh
        dst: /usr/share/zsh/vendor-completions/_sx
        packager: deb
      - src: ./completions/spotexec.zsh
        dst: /usr/share/zsh/site-functions/_spotexec
        packager: rpm
      - src: ./completions/sx.zsh
        dst: /usr/share/zsh/site-functions/_sx
        packager: rpm
      - src: ./completions/spotexec.zsh
        dst: /usr/share/zsh/site-functions/_spotexec
        packager: apk
      - src: ./completions/sx.zsh
        dst: /usr/share/zsh/site-functions/_sx
        packager: apk

# Homebrew formula (macOS and Linux) in daintreehq/homebrew-tap, pushed with
# a deploy key that can write to that repository only.
# `brews` is deprecated in favour of `homebrew_casks` (removal is due in
# GoReleaser v3). It stays a formula for now, with GoReleaser pinned in the
# workflows: a cask would be quarantined on macOS (the binary is unsigned)
# and changes how existing installs and `spotexec setup` upgrade.
brews:
  - name: spotexec
    repository:
      owner: daintreehq
      name: homebrew-tap
      branch: main
      git:
        url: git@github.com:daintreehq/homebrew-tap.git
        private_key: "{{ .Env.HOMEBREW_TAP_DEPLOY_KEY }}"
    directory: Formula
    homepage: https://spotexec.com
    description: Offload tests and builds from local worktrees to remote and AWS Spot runners
    license: MIT
    commit_author:
      name: spotexec-release
      email: spotexec-release@users.noreply.github.com
    # No `depends_on "git"`: spotexec runs inside Git worktrees, so git is
    # already there, and on Linuxbrew it would pull in ~30 packages.
    install: |
      bin.install "spotexec"
      bin.install_symlink "spotexec" => "sx"
      bash_completion.install "completions/spotexec.bash" => "spotexec"
      bash_completion.install "completions/sx.bash" => "sx"
      zsh_completion.install "completions/spotexec.zsh" => "_spotexec"
      zsh_completion.install "completions/sx.zsh" => "_sx"
      fish_completion.install "completions/spotexec.fish"
      fish_completion.install "completions/sx.fish"
    test: |
      assert_equal "spotexec #{version}", shell_output("#{bin}/spotexec --version").strip
      assert_equal "spotexec #{version}", shell_output("#{bin}/sx --version").strip
